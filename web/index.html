<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="갓오하 유저 필수 앱.">
  <meta name="application-name" content="GOH_계산기">
  <meta name="theme-color" content="#0175C2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GOH_계산기">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GOH_계산기</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    // PWA 뒤로가기 버튼 히스토리 관리
    // Flutter Navigator와 브라우저 히스토리 동기화
    window.addEventListener('load', function() {
      // 초기 히스토리 스택 생성 (빈 상태 추가)
      if (window.history.state === null) {
        window.history.pushState({}, '');
      }
      
      // 뒤로가기 이벤트 리스너
      window.addEventListener('popstate', function(event) {
        // Flutter의 뒤로가기 처리를 위해 히스토리 복원
        window.history.pushState({}, '');
      });
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
